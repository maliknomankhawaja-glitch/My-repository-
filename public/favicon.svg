<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EEDD" />
      <stop offset="35%" stop-color="#C8A97E" />
      <stop offset="70%" stop-color="#E5D6BD" />
      <stop offset="100%" stop-color="#9E7B4F" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Curved Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Gold Thread Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.65" />
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="8 6" />

  <!-- Central Diamond Atelier Crest -->
  <g transform="translate(256, 256) scale(0.92)" filter="url(#subtleShadow)">
    <!-- Rotating diamond frame -->
    <path d="M 0 -168 L 168 0 L 0 168 L -168 0 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4" />
    
    <!-- Corner Accents -->
    <circle cx="0" cy="-168" r="4" fill="url(#goldGradient)" />
    <circle cx="168" cy="0" r="4" fill="url(#goldGradient)" />
    <circle cx="0" cy="168" r="4" fill="url(#goldGradient)" />
    <circle cx="-168" cy="0" r="4" fill="url(#goldGradient)" />

    <!-- Sovereign Interlocked Monogram 'NK' in Regal Serif -->
    <text x="0" y="42" 
          font-family="'Bodoni Moda', 'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
          font-size="164" 
          font-weight="600" 
          letter-spacing="4"
          fill="url(#goldGradient)" 
          text-anchor="middle">NK</text>

    <!-- Atelier Underline & Star -->
    <line x1="-72" y1="84" x2="72" y2="84" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="84" r="3.5" fill="url(#goldGradient)" />

    <!-- Subtitle 'HAUTE COUTURE' -->
    <text x="0" y="112" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="19" 
          font-weight="500" 
          letter-spacing="8" 
          fill="#FAF8F5" 
          opacity="0.85"
          text-anchor="middle">FABRICS</text>
  </g>
</svg>
